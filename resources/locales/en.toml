# English strings for the loki module.
# `[module] title`/`description` are what the manager shows on the module card
# for the active language; the rest are the module's own UI strings, looked up at
# render time via `host.locale()` + the SDK `Catalog`.

# The module's view/window title, kept identical to `[module] title` so the panel
# header matches the tab and the card.
title = "Loki Scanner"

[module]
title = "Loki Scanner"
description = "Scans files and process memory for indicators of compromise with Loki-RS (YARA + IOC), and reads the reports it produces. Installs the scanner itself on first use."

[install]
