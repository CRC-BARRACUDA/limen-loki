h_yara_file = ".yar or .yara"
h_yara_example = """rule My_Rule {
  meta:
    description = "What it catches"
    score = 85
  strings:
    $a = "suspicious string"
  condition:
    $a
}"""
h_yara_n1 = "score in the meta block sets how heavily a match counts. Without it, a match scores 75."
h_yara_n2 = "A rule scoring below the Notice threshold (40 by default) never reaches the results at all."
h_yara_n3 = "Compiled together with the bundled rules before every scan."

h_hashes_file = ".txt, one indicator per line"
h_hashes_example = "44d88612fea8a8f36de82e1278abb02f;EICAR test file"
h_hashes_n1 = "MD5, SHA1 and SHA256 all work, mixed in one file — the kind is recognised from the length."
h_hashes_n2 = "The description is required. A bare hash is skipped without a word."
h_hashes_n3 = "Matches always score 75; a third field is read but ignored."
h_hashes_n4 = "The example is the EICAR test file — a harmless file made for exactly this. Copy a real hash in, not one that matches something ordinary: the hash of an empty file would flag every empty file on the machine."

h_filenames_file = ".txt, one pattern per line"
h_filenames_example = ".*\\/mimikatz.*;Mimikatz on disk"
h_filenames_n1 = "A regular expression, matched against the whole path."
h_filenames_n2 = "The description is required. A bare pattern is skipped without a word."
h_filenames_n3 = "An expression that does not compile is skipped just as quietly, so test it before relying on it."
h_filenames_n4 = "Matches always score 75."

h_c2_file = ".txt, one address per line"
h_c2_example = "evil.example.com;Known C2\n203.0.113.7;C2 address"
h_c2_n1 = "A host name or an IP address."
h_c2_n2 = "These are matched against the remote addresses of running processes, so they do nothing unless \"Scan process memory\" is on."
h_c2_n3 = "A description is optional here, and ignored either way."
h_c2_n4 = "Matches always score 75."

